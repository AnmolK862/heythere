<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(to top right, #ffdee9, #b5fffc);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'Great Vibes', cursive;
    }

    .message {
      font-size: 64px;
      color: #e91e63;
      text-shadow: 2px 2px 10px #fff;
      z-index: 10;
      position: relative;
      animation: popIn 2s ease-out forwards;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    .flower {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at center, #ff4d6d, #ff0066);
      border-radius: 50%;
      position: absolute;
      animation: bloom 2s ease-in-out infinite alternate;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
      z-index: 1;
    }

    .flower::before, .flower::after {
      content: '';
      position: absolute;
      width: 50px;
      height: 50px;
      background: inherit;
      border-radius: 50%;
    }

    .flower::before {
      transform: rotate(45deg);
    }

    .flower::after {
      transform: rotate(-45deg);
    }

    @keyframes bloom {
      0% {
        transform: scale(1) rotate(0deg);
      }
      100% {
        transform: scale(1.2) rotate(10deg);
      }
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: floatHeart 6s linear infinite;
      opacity: 0.7;
      z-index: 1;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(1) rotate(45deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) scale(1.2) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="message">I Love You 💖</div>

  <script>
    const body = document.body;

    // Create vibrant animated flowers
    for (let i = 0; i < 40; i++) {
      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.style.top = Math.random() * 100 + 'vh';
      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.animationDuration = (2 + Math.random() * 3) + 's';
      flower.style.background = `radial-gradient(circle at center, 
        hsl(${Math.random() * 360}, 100%, 70%), 
        hsl(${Math.random() * 360}, 100%, 50%))`;
      body.appendChild(flower);
    }

    // Create floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 4 + Math.random() * 4 + 's';
      heart.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 300);
  </script>
</body>
</html>
